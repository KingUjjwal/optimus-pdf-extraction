[package]
name = "optimus-app"
version = "0.1.0"
edition = "2021"

[lib]
name = "optimus_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.35", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
optimus-core = { path = "../optimus-core" }
optimus-router = { path = "../optimus-router" }
optimus-agent = { path = "../optimus-agent" }
optimus-runtime = { path = "../optimus-runtime" }

[dev-dependencies]
anyhow = "1.0"
