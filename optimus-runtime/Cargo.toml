[package]
name = "optimus-runtime"
version = "0.1.0"
edition = "2021"

[dependencies]
optimus-core = { path = "../optimus-core" }
optimus-router = { path = "../optimus-router" }
optimus-agent = { path = "../optimus-agent" }
wasmtime = "20.0"
rayon = "1.8"
arrow = { version = "51.0", features = ["ipc"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
parking_lot = "0.12"
tokio = { version = "1.35", features = ["full"] }
futures = "0.3"
tracing = "0.1"
chrono = "0.4"

[dev-dependencies]
tempfile = "3"
