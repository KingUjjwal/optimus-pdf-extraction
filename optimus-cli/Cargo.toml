[package]
name = "optimus-cli"
version = "0.1.0"
edition = "2021"

[dependencies]
optimus-core = { path = "../optimus-core" }
optimus-router = { path = "../optimus-router" }
optimus-agent = { path = "../optimus-agent" }
optimus-runtime = { path = "../optimus-runtime" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
arrow = { version = "51.0", features = ["ipc"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
notify = "6.1"
ctrlc = "3.4"
