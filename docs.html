<style>
:root {
  --bg: hsl(222, 47%, 6%);
  --bg-sidebar: hsl(222, 47%, 8%);
  --bg-card: hsla(222, 47%, 11%, 0.8);
  --bg-card-hover: hsla(222, 47%, 15%, 0.95);
  --border: hsla(217, 33%, 32%, 0.25);
  --border-active: hsla(190, 90%, 50%, 0.4);
  --text: hsl(210, 40%, 96%);
  --text-dim: hsl(215, 20%, 60%);
  --text-muted: hsl(215, 18%, 45%);
  --primary: hsl(190, 90%, 50%);
  --primary-dim: hsla(190, 90%, 50%, 0.12);
  --secondary: hsl(263, 90%, 65%);
  --secondary-dim: hsla(263, 90%, 65%, 0.12);
  --accent: hsl(38, 92%, 50%);
  --accent-dim: hsla(38, 92%, 50%, 0.12);
  --success: hsl(142, 70%, 45%);
  --success-dim: hsla(142, 70%, 45%, 0.12);
  --danger: hsl(350, 80%, 55%);
  --danger-dim: hsla(350, 80%, 55%, 0.12);
  --font-title: 'Outfit', sans-serif;
  --font-body: 'Inter', sans-serif;
  --font-mono: 'Fira Code', monospace;
  --sidebar-w: 300px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  line-height: 1.6;
  display: flex;
  min-height: 100vh;
  overflow-x: hidden;
}
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: hsla(217,33%,40%,0.4); }

/* Sidebar */
.sidebar {
  position: fixed; top: 0; left: 0; width: var(--sidebar-w); height: 100vh;
  background: var(--bg-sidebar); border-right: 1px solid var(--border);
  z-index: 100; display: flex; flex-direction: column; overflow: hidden;
}
.sidebar-header {
  padding: 1.25rem 1rem; border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.sidebar-header h1 {
  font-family: var(--font-title); font-size: 1.3rem; font-weight: 700;
  background: linear-gradient(135deg, var(--text) 30%, var(--primary) 70%, var(--secondary));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.sidebar-header .ver {
  font-size: 0.75rem; color: var(--text-muted); font-family: var(--font-mono);
  margin-top: 2px;
}
.search-box {
  width: 100%; padding: 0.6rem 0.75rem; margin-top: 0.75rem;
  background: hsla(222,47%,16%,0.8); border: 1px solid var(--border);
  border-radius: 8px; color: var(--text); font-family: var(--font-body);
  font-size: 0.85rem; outline: none; transition: border 0.2s;
}
.search-box:focus { border-color: var(--primary); }
.search-box::placeholder { color: var(--text-muted); }
.sidebar-nav {
  flex: 1; overflow-y: auto; padding: 0.75rem 0;
}
.nav-section {
  margin-bottom: 0.25rem;
}
.nav-section-header {
  display: flex; align-items: center; gap: 0.5rem;
  padding: 0.5rem 1rem; cursor: pointer; font-family: var(--font-title);
  font-size: 0.85rem; font-weight: 600; color: var(--text-dim);
  transition: all 0.15s; user-select: none; letter-spacing: 0.03em;
  text-transform: uppercase;
}
.nav-section-header:hover { color: var(--text); background: hsla(222,47%,15%,0.5); }
.nav-section-header .arrow { transition: transform 0.2s; font-size: 0.7rem; }
.nav-section-header .arrow.open { transform: rotate(90deg); }
.nav-section-items { display: none; }
.nav-section-items.open { display: block; }
.nav-item {
  display: block; padding: 0.35rem 1rem 0.35rem 2rem;
  font-size: 0.85rem; color: var(--text-dim); text-decoration: none;
  cursor: pointer; transition: all 0.15s; border-left: 2px solid transparent;
}
.nav-item:hover { color: var(--text); background: hsla(222,47%,15%,0.3); }
.nav-item.active {
  color: var(--primary); border-left-color: var(--primary);
  background: var(--primary-dim);
}
.nav-item .kind {
  display: inline-block; font-size: 0.65rem; font-weight: 600;
  padding: 0 5px; border-radius: 3px; margin-right: 4px;
}
.nav-item .kind.mod { color: var(--primary); background: var(--primary-dim); }
.nav-item .kind.str { color: var(--accent); background: var(--accent-dim); }
.nav-item .kind.enm { color: var(--secondary); background: var(--secondary-dim); }
.nav-item .kind.fn  { color: var(--success); background: var(--success-dim); }
.nav-item .kind.trt { color: var(--danger); background: var(--danger-dim); }
.nav-item .kind.con { color: var(--text-dim); background: hsla(217,33%,32%,0.15); }

/* Main */
.main {
  margin-left: var(--sidebar-w); flex: 1; min-height: 100vh;
  padding: 2rem 2.5rem; max-width: 1100px;
}
.hidden { display: none !important; }

/* Page content */
.page { display: none; animation: fadeIn 0.3s ease; }
.page.active { display: block; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

.page-header {
  margin-bottom: 2rem; padding-bottom: 1.5rem;
  border-bottom: 1px solid var(--border);
}
.page-header h2 {
  font-family: var(--font-title); font-size: 2rem; font-weight: 700;
  display: flex; align-items: center; gap: 0.75rem;
}
.page-header h2 .icon { font-size: 1.5rem; }
.page-header p { color: var(--text-dim); margin-top: 0.5rem; font-size: 1.05rem; }
.page-header .filepath {
  font-family: var(--font-mono); font-size: 0.8rem; color: var(--text-muted);
  margin-top: 0.25rem;
}

.section {
  margin-bottom: 2.5rem;
}
.section-title {
  font-family: var(--font-title); font-size: 1.3rem; font-weight: 600;
  margin-bottom: 1rem; display: flex; align-items: center; gap: 0.5rem;
}
.section-title .count {
  font-size: 0.75rem; font-weight: 500; color: var(--text-muted);
  background: hsla(217,33%,32%,0.15); padding: 0.1rem 0.5rem;
  border-radius: 4px;
}
.section-desc {
  color: var(--text-dim); font-size: 0.95rem; margin-bottom: 1rem;
}

/* Item card */
.item-card {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: 10px; padding: 1rem 1.25rem; margin-bottom: 0.75rem;
  transition: border 0.2s;
}
.item-card:hover { border-color: var(--border-active); }
.item-card-header {
  display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap;
  margin-bottom: 0.25rem;
}
.item-card-header .name {
  font-family: var(--font-mono); font-size: 1rem; font-weight: 500;
  color: var(--text);
}
.item-card-header .name a { color: inherit; text-decoration: none; }
.item-card-header .name a:hover { color: var(--primary); }
.item-card-header .tag {
  font-size: 0.65rem; font-weight: 600; text-transform: uppercase;
  padding: 0.15rem 0.45rem; border-radius: 4px; letter-spacing: 0.03em;
}
.tag.pub { background: var(--success-dim); color: var(--success); }
.tag.mod { background: var(--primary-dim); color: var(--primary); }
.tag.str { background: var(--accent-dim); color: var(--accent); }
.tag.enm { background: var(--secondary-dim); color: var(--secondary); }
.tag.fn  { background: var(--success-dim); color: var(--success); }
.tag.trt { background: var(--danger-dim); color: var(--danger); }
.tag.con { background: hsla(217,33%,32%,0.15); color: var(--text-dim); }
.tag.ife { background: hsla(142,70%,45%,0.1); color: var(--success); border: 1px solid hsla(142,70%,45%,0.2); }
.tag.typ { background: hsla(38,92%,50%,0.1); color: var(--accent); border: 1px solid hsla(38,92%,50%,0.2); }

.item-card .sig {
  font-family: var(--font-mono); font-size: 0.85rem; color: var(--text-dim);
  margin-top: 0.25rem; white-space: pre-wrap; word-break: break-word;
}
.item-card .desc {
  font-size: 0.9rem; color: var(--text-dim); margin-top: 0.5rem;
  line-height: 1.5;
}
.item-card .desc code {
  font-family: var(--font-mono); font-size: 0.82rem;
  background: hsla(222,47%,16%,0.8); padding: 0.1rem 0.3rem; border-radius: 3px;
}
.item-card .derives {
  margin-top: 0.4rem; display: flex; gap: 0.3rem; flex-wrap: wrap;
}
.item-card .derives span {
  font-size: 0.7rem; background: hsla(217,33%,32%,0.1); color: var(--text-muted);
  padding: 0.1rem 0.4rem; border-radius: 3px;
}

/* Module tree */
.tree {
  font-family: var(--font-mono); font-size: 0.9rem;
}
.tree-item {
  display: flex; align-items: center; gap: 0.5rem;
  padding: 0.3rem 0; cursor: default;
}
.tree-item .icon {
  width: 20px; text-align: center; font-size: 0.85rem;
}
.tree-item .icon.mod { color: var(--primary); }
.tree-item .icon.file { color: var(--text-muted); }
.tree-item .icon.dir { color: var(--accent); }
.tree-item .path { color: var(--text-dim); }
.tree-children { padding-left: 1.5rem; }

/* Stat boxes */
.stats-row {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 1rem; margin-bottom: 1.5rem;
}
.stat-box {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: 10px; padding: 1rem; text-align: center;
}
.stat-box .num {
  font-family: var(--font-title); font-size: 1.8rem; font-weight: 700;
  background: linear-gradient(135deg, var(--primary), var(--secondary));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.stat-box .label { font-size: 0.8rem; color: var(--text-dim); margin-top: 0.25rem; }

/* Dep graph */
.dep-graph { display: flex; flex-wrap: wrap; gap: 1rem; align-items: center; justify-content: center; padding: 2rem 0; }
.dep-node {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: 10px; padding: 1rem 1.5rem; text-align: center;
  cursor: pointer; transition: all 0.2s; min-width: 130px;
}
.dep-node:hover { border-color: var(--primary); transform: translateY(-2px); }
.dep-node .dep-name { font-family: var(--font-title); font-weight: 600; font-size: 1rem; }
.dep-node .dep-count { font-size: 0.75rem; color: var(--text-muted); }
.dep-arrow { color: var(--text-muted); font-size: 1.2rem; flex-shrink: 0; }

/* Table */
.table-wrap { overflow-x: auto; }
table {
  width: 100%; border-collapse: collapse; font-size: 0.9rem;
}
th {
  text-align: left; padding: 0.6rem 0.75rem; border-bottom: 2px solid var(--border);
  font-family: var(--font-title); font-weight: 600; color: var(--text-dim);
  font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.03em;
}
td {
  padding: 0.6rem 0.75rem; border-bottom: 1px solid hsla(217,33%,32%,0.12);
  color: var(--text-dim);
}
td code { font-family: var(--font-mono); font-size: 0.8rem; color: var(--text); }
tr:hover td { background: hsla(222,47%,12%,0.5); }
td .tag { font-size: 0.6rem; }

/* Events table */
.evt-dir { display: inline-block; font-size: 0.65rem; font-weight: 600; padding: 0.1rem 0.4rem; border-radius: 3px; }
.evt-dir.rust-js { background: var(--primary-dim); color: var(--primary); }
.evt-dir.js-rust { background: var(--accent-dim); color: var(--accent); }

/* Badge */
.badge-list { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1rem; }
.badge-pill {
  display: inline-flex; align-items: center; gap: 0.3rem;
  padding: 0.25rem 0.75rem; border-radius: 9999px; font-size: 0.78rem;
  font-weight: 500; border: 1px solid var(--border); background: hsla(222,47%,12%,0.6);
  color: var(--text-dim);
}
.badge-pill .num { font-family: var(--font-mono); font-weight: 600; color: var(--primary); }

/* Code block */
pre.code {
  background: #0f172a; border: 1px solid var(--border); border-radius: 10px;
  padding: 1.25rem; overflow-x: auto; font-family: var(--font-mono);
  font-size: 0.82rem; color: #e2e8f0; margin: 0.5rem 0;
}
pre.code .hl { color: var(--primary); }
pre.code .hlk { color: var(--secondary); }
pre.code .hls { color: var(--accent); }
pre.code .hlc { color: var(--text-muted); }

/* Pipeline visual */
.pipeline { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; margin: 1.5rem 0; }
.pipe-step {
  display: flex; flex-direction: column; align-items: center; gap: 0.25rem;
  padding: 0.75rem 1rem; background: var(--bg-card); border: 1px solid var(--border);
  border-radius: 8px; min-width: 80px; text-align: center;
}
.pipe-step .num {
  font-family: var(--font-mono); font-size: 0.7rem; font-weight: 600; color: var(--text-muted);
}
.pipe-step .name { font-family: var(--font-title); font-size: 0.75rem; font-weight: 600; color: var(--text-dim); }
.pipe-step .crate { font-family: var(--font-mono); font-size: 0.65rem; color: var(--text-muted); }
.pipe-arrow { color: var(--text-muted); font-size: 1.1rem; }

/* Responsive */
@media (max-width: 900px) {
  .sidebar { width: 240px; }
  .main { margin-left: 240px; padding: 1.5rem; }
  .stats-row { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 700px) {
  .sidebar { width: 100%; height: auto; position: relative; border-right: none; border-bottom: 1px solid var(--border); max-height: 40vh; }
  .main { margin-left: 0; padding: 1rem; }
  .stats-row { grid-template-columns: 1fr 1fr; }
  .dep-graph { flex-direction: column; }
  .dep-arrow { transform: rotate(90deg); }
  .pipeline { flex-direction: column; }
  .pipe-arrow { transform: rotate(90deg); }
}
</style>

const ESC = str => String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const KIND_TAG = k => `<span class="tag ${k}">${k}</span>`;

function pageId(id) { return 'page-' + id.replace(/[^a-z0-9-]/g,'-'); }

function renderSidebar() {
  const nav = document.getElementById('sidebar-nav');
  let html = '';

  // Overview
  html += `<div class="nav-section">
    <div class="nav-section-header" onclick="toggleNav(this)">
      <span class="arrow">▸</span> Overview
    </div>
    <div class="nav-section-items open">
      <a class="nav-item active" data-page="overview" onclick="showPage('overview', this)">📊 Project Overview</a>
      <a class="nav-item" data-page="pipeline" onclick="showPage('pipeline', this)">🔁 Pipeline Flow</a>
      <a class="nav-item" data-page="config" onclick="showPage('config', this)">⚙️ Configuration</a>
      <a class="nav-item" data-page="events" onclick="showPage('events', this)">📡 Events</a>
      <a class="nav-item" data-page="cli" onclick="showPage('cli', this)">💻 CLI Reference</a>
      <a class="nav-item" data-page="frontend" onclick="showPage('frontend', this)">🎨 Frontend</a>
      <a class="nav-item" data-page="build" onclick="showPage('build', this)">🔨 Build & Dev</a>
      <a class="nav-item" data-page="deps" onclick="showPage('deps', this)">📦 Dependencies</a>
      <a class="nav-item" data-page="tests" onclick="showPage('tests', this)">✅ Tests & Benchmarks</a>
    </div>
  </div>`;

  // Crates
  DATA.crates.forEach(crate => {
    html += `<div class="nav-section">
      <div class="nav-section-header" onclick="toggleNav(this)">
        <span class="arrow">▸</span> ${crate.name}
      </div>
      <div class="nav-section-items open">
        <a class="nav-item" data-page="${pageId(crate.id)}" onclick="showPage('${pageId(crate.id)}', this)">📦 Overview</a>`;
    crate.files.forEach(f => {
      const fileId = pageId(crate.id + '/' + f.name);
      html += `<a class="nav-item" data-page="${fileId}" onclick="showPage('${fileId}', this)"><span class="kind fn">fn</span> ${f.name}</a>`;
    });
    if (crate.integrationTests && crate.integrationTests.length) {
      html += `<a class="nav-item" data-page="${pageId(crate.id + '/integration-tests')}" onclick="showPage('${pageId(crate.id + '/integration-tests')}', this)"><span class="kind ife">it</span> Integration Tests</a>`;

    html += `</div></div>`;
  });

  nav.innerHTML = html;
}

function toggleNav(el) {
  el.classList.toggle('open');
  const arrow = el.querySelector('.arrow');
  const items = el.nextElementSibling;
  arrow.classList.toggle('open');
  items.classList.toggle('open');
}

function renderDepGraph() {
  // Compute dependency mapping
  const nodeMap = {};
  DATA.crates.forEach(c => { nodeMap[c.name] = c; });
  const rendered = new Set();
  const lines = [];

  // Render each crate in topological-ish order
  const order = ['optimus-guest', 'optimus-core', 'optimus-router', 'optimus-agent', 'optimus-runtime', 'optimus-cli', 'src-tauri'];
  order.forEach(name => {
    const c = nodeMap[name];
    if (!c) return;
    const page = pageId(c.id);
    lines.push(`<div class="dep-node" onclick="showPage('${page}', document.querySelector('[data-page=\"${page}\"]'))" style="border-color:${c.color};">
      <div class="dep-name" style="color:${c.color}">${c.name}</div>
      <div class="dep-count">${c.files.length} files · ${c.purpose}</div>
    </div>`);
    if (c.deps && c.deps.length) {
      c.deps.forEach(depName => {
        const dep = nodeMap[depName];
        const depPage = pageId(dep ? dep.id : depName);
        lines.push(`<div class="dep-node dep-arrow" style="border-color:transparent;background:transparent;padding:0;min-width:auto;" onclick="showPage('${depPage}', document.querySelector('[data-page=\"${depPage}\"]'))">
          <span style="font-size:1.5rem;cursor:pointer;">→</span>
        </div>`);
        if (dep) {
          lines.push(`<div class="dep-node" onclick="showPage('${depPage}', document.querySelector('[data-page=\"${depPage}\"]'))" style="border-color:${dep.color};">
            <div class="dep-name" style="color:${dep.color}">${dep.name}</div>
            <div class="dep-count">${dep.files.length} files</div>
          </div>`);
        }
      });
    }
  });
  return lines.join('\n');
}

  'cli': renderCLI,
  'frontend': renderFrontend,
  'build': renderBuild,
  'deps': renderDeps,
  'tests': renderTests
};

function getPageContent(pageId) {
  // Check specialized renderers
  if (pageRenderers[pageId]) return pageRenderers[pageId]();

  // Check crate pages
  for (const c of DATA.crates) {
    if (pageId(c.id) === pageId) return renderCratePage(pageId);
    for (const f of c.files) {
      if (pageId(c.id + '/' + f.name) === pageId) return renderFilePage(pageId);
    }
    if (pageId(c.id + '/integration-tests') === pageId) return renderIntegrationTestsPage(pageId);
    if (pageId(c.id + '/deps') === pageId) return renderCrateDepsPage(pageId);
  }

  return '<h2>Page not found</h2>';
}

function showPage(pageId, navEl) {
  // Update nav
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  if (navEl) navEl.classList.add('active');
  else {
    const match = document.querySelector(`[data-page="${pageId}"]`);
    if (match) match.classList.add('active');
  }

  // Render content
  const container = document.getElementById('page-container');
  container.innerHTML = `<div class="page active">${getPageContent(pageId)}</div>`;
}

// ============================================================
// SEARCH
// ============================================================
function searchPages(query) {
  if (!query.trim()) {
    // Reset: show overview
    showPage('overview', document.querySelector('[data-page="overview"]'));
    return;
  }
  const q = query.toLowerCase();
  const results = [];

  // Search all items across all crates
  DATA.crates.forEach(c => {
    c.files.forEach(f => {
      f.items.forEach(item => {
        if (item.name.toLowerCase().includes(q) || (item.desc && item.desc.toLowerCase().includes(q))) {
          results.push({ crate: c.name, file: f.name, item, page: pageId(c.id + '/' + f.name) });
        }
      });
      if (f.tests) f.tests.forEach(t => {
        if (t.toLowerCase().includes(q)) {
          results.push({ crate: c.name, file: f.name, item: { kind: 'ife', name: t, desc: 'Unit test', sig: '' }, page: pageId(c.id + '/' + f.name) });
        }
      });
    });
    if (c.integrationTests) c.integrationTests.forEach(t => {
      if (t.toLowerCase().includes(q)) {
        results.push({ crate: c.name, file: 'tests/', item: { kind: 'ife', name: t, desc: 'Integration test', sig: '' }, page: pageId(c.id) });
      }
    });
  });

  const container = document.getElementById('page-container');
  if (results.length === 0) {
    container.innerHTML = `<div class="page active"><div class="page-header"><h2>Search: "${ESC(query)}"</h2><p>No results found.</p></div></div>`;
    return;
  }
  let html = `<div class="page active">
    <div class="page-header"><h2>Search: "${ESC(query)}"</h2><p>${results.length} result${results.length > 1 ? 's' : ''}</p></div>
    <div class="section">`;
  results.forEach(r => {
    html += `<div class="item-card" onclick="showPage('${r.page}', document.querySelector('[data-page=\"${r.page}\"]'))" style="cursor:pointer;">
      <div class="item-card-header">
        <span class="tag ${r.item.kind}">${r.item.kind}</span>
        <span class="name">${ESC(r.item.name)}</span>
        <span style="font-size:0.75rem;color:var(--text-muted);margin-left:auto;">${r.crate}/${r.file}</span>
      </div>
      ${r.item.sig ? `<div class="sig">${ESC(r.item.sig)}</div>` : ''}
      <div class="desc">${r.item.desc}</div>
    </div>`;
  });
  html += `</div></div>`;
  container.innerHTML = html;
}
